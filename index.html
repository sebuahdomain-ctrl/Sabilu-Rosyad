<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mockup PDF Reader Quran</title>

  <style>
    /* ---------- Dasar ---------- */
    :root {
      --bg: #121413;
      --surface: #1A1D1B;
      --line: #2A2E2B;
      --frame: #33383A;
      --page: #161918;
      --text: #E6E7E3;
      --muted: #8B908C;
      --accent: #7FA487;

      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      background: var(--bg);
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* menutup area di bawah status bar saat scroll */
    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 10;
    }

    [hidden] { display: none !important; }

    button {
      font-family: inherit;
      color: inherit;
      cursor: pointer;
    }

    .app {
      display: flex;
      flex-direction: column;
      max-width: 430px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 22px;
      background: transparent;
    }

    .icon-btn:active,
    .row:active,
    .group:active {
      background: var(--surface);
    }

    /* ---------- Beranda ---------- */
    .head {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--bg);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 20px 20px;
    }

    .top h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      flex: 1;
      height: 44px;
      padding: 0;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
    }

    .tab[aria-selected="true"] {
      font-weight: 600;
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 44px;
      padding: 0 20px;
      border: 0;
      background: var(--surface);
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 56px;
      padding: 0 20px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }

    .row .n {
      width: 36px;
      font-size: 14px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .row .name {
      flex: 1;
      font-size: 17px;
    }

    .row .sub {
      font-size: 13px;
      color: var(--muted);
    }

    /* ---------- Pembaca ---------- */
    #reader {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 28px 8px 12px;
    }

    .bar span {
      font-size: 18px;
      font-weight: 600;
    }

    .page {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 480px;
      margin: 8px 20px 24px;
      border: 1px solid var(--frame);
      border-radius: 4px;
      background: var(--page);
    }

    .page b {
      font-size: 15px;
      font-weight: 400;
    }

    .page small {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- Beranda -->
    <section id="home">
      <div class="head">
        <div class="top">
          <h1>Alqur’an</h1>
          <button class="icon-btn" aria-label="Cari surat">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="M20 20l-3.5-3.5"/>
            </svg>
          </button>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-surat" aria-selected="true">Surat</button>
          <button class="tab" role="tab" id="tab-juz" aria-selected="false">Juz</button>
          <button class="tab" role="tab" id="tab-penanda" aria-selected="false">Penanda</button>
        </div>
      </div>

      <div id="list"></div>
    </section>

    <!-- Pembaca PDF -->
    <section id="reader" hidden>
      <div class="bar">
        <button class="icon-btn" id="back" aria-label="Kembali">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
        <span id="title"></span>
      </div>

      <div class="page">
        <b>Halaman PDF tampil di sini</b>
        <small>Geser ke kiri untuk lanjut</small>
      </div>
    </section>

  </div>

  <script>
    // ---------- Data ----------
    // Tiap juz berisi surat-surat yang dimulai di juz tersebut.
    const JUZ = [
      ['Juz 1',  ['Al-Fatihah', 'Al-Baqarah']],
      ['Juz 2',  []],
      ['Juz 3',  ['Ali ‘Imran']],
      ['Juz 4',  ['An-Nisa’']],
      ['Juz 5',  []],
      ['Juz 6',  ['Al-Ma’idah']],
      ['Juz 7',  ['Al-An’am']],
      ['Juz 8',  ['Al-A’raf']],
      ['Juz 9',  ['Al-Anfal']],
      ['Juz 10', ['At-Taubah']],
    ];

    const PENANDA = [
      ['Al-Baqarah', 'Halaman 12'],
      ['Juz 3',      'Halaman 5'],
      ['An-Nisa’',   'Halaman 3'],
    ];

    const CHEVRON =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M9 6l6 6-6 6"/></svg>';

    // ---------- Elemen ----------
    const home   = document.getElementById('home');
    const reader = document.getElementById('reader');
    const list   = document.getElementById('list');
    const title  = document.getElementById('title');

    const tabs = {
      surat:   document.getElementById('tab-surat'),
      juz:     document.getElementById('tab-juz'),
      penanda: document.getElementById('tab-penanda'),
    };

    // ---------- Navigasi ----------
    function openReader(name) {
      title.textContent = name;
      home.hidden = true;
      reader.hidden = false;
      window.scrollTo(0, 0);
    }

    function showHome() {
      reader.hidden = true;
      home.hidden = false;
    }

    // ---------- Daftar ----------
    function makeButton(className, html, name) {
      const button = document.createElement('button');
      button.className = className;
      button.innerHTML = html;
      button.addEventListener('click', () => openReader(name));
      return button;
    }

    function renderSurat() {
      list.innerHTML = '';
      let nomor = 0;

      JUZ.forEach(([juz, surat]) => {
        list.appendChild(makeButton('group', `<span>${juz}</span>${CHEVRON}`, juz));

        surat.forEach((nama) => {
          nomor++;
          list.appendChild(makeButton(
            'row',
            `<span class="n">${nomor}</span><span class="name">${nama}</span>`,
            nama
          ));
        });
      });
    }

    function renderJuz() {
      list.innerHTML = '';

      JUZ.forEach(([juz]) => {
        list.appendChild(makeButton('row', `<span class="name">${juz}</span>`, juz));
      });
    }

    function renderPenanda() {
      list.innerHTML = '';

      PENANDA.forEach(([nama, halaman]) => {
        list.appendChild(makeButton(
          'row',
          `<span class="name">${nama}</span><span class="sub">${halaman}</span>`,
          nama
        ));
      });
    }

    // ---------- Tab ----------
    const renderers = { surat: renderSurat, juz: renderJuz, penanda: renderPenanda };

    function setTab(active) {
      Object.keys(tabs).forEach((key) => {
        tabs[key].setAttribute('aria-selected', key === active);
      });
      renderers[active]();
    }

    Object.keys(tabs).forEach((key) => {
      tabs[key].addEventListener('click', () => setTab(key));
    });

    document.getElementById('back').addEventListener('click', showHome);

    setTab('surat');
  </script>
</body>
</html>
